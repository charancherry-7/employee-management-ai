name: Build and deploy Python app to Azure Web App - employee-mgmt-python-ap
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and Start virtual environment and Install dependencies
        run: |
          cd Databricks-backend/backend
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            Databricks-backend/backend
            !Databricks-backend/backend/antenv/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E54B900D3B16440794A203A915AF103E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1CB8DA2D8F29438CBD47E53A7CC12E98 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B2EC1D6A1FC04D5092DD10368055E53B }}
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'employee-mgmt-python-ap'
          slot-name: 'Production'
